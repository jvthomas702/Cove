name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Package app
        run: ./scripts/build-app.sh
      - name: Check scripts
        run: |
          for f in bin/* scripts/*.sh; do bash -n "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Cove.app
          path: build/Cove.app
