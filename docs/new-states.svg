<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4a5f"/>
      <stop offset="1" stop-color="#5a4a78"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="720" fill="#0f1016"/>

  <!-- Class countdown -->
  <g>
    <rect x="30" y="24" width="840" height="64" rx="10" fill="url(#sky2)"/>
    <rect x="30" y="24" width="840" height="20" fill="#000" opacity="0.18"/>
    <path d="M232 24 q8 0 8 8 v12 q0 12 12 12 h396 q12 0 12 -12 v-12 q0 -8 8 -8 z" fill="#000"/>
    <circle cx="256" cy="40" r="3.5" fill="#5AC8FA"/>
    <text x="265" y="45" fill="#fff" font-size="12.5" font-weight="600">CPE 3000 Lecture</text>
    <text x="586" y="45" fill="#fff" fill-opacity="0.85" font-size="12.5" font-weight="600">in 12 min</text>
    <text x="42" y="80" fill="#fff" opacity="0.85" font-size="13" font-weight="600">Class / meeting countdown beside the notch</text>
  </g>

  <!-- Volume HUD -->
  <g transform="translate(0,104)">
    <rect x="30" y="24" width="840" height="64" rx="10" fill="url(#sky2)"/>
    <rect x="30" y="24" width="840" height="20" fill="#000" opacity="0.18"/>
    <path d="M308 24 q8 0 8 8 v12 q0 12 12 12 h244 q12 0 12 -12 v-12 q0 -8 8 -8 z" fill="#000"/>
    <text x="330" y="45" fill="#fff" font-size="13">🔊</text>
    <rect x="534" y="37" width="48" height="6" rx="3" fill="#fff" fill-opacity="0.18"/>
    <rect x="534" y="37" width="31" height="6" rx="3" fill="#fff"/>
    <text x="42" y="80" fill="#fff" opacity="0.85" font-size="13" font-weight="600">Volume / brightness HUD (replaces the system pop-up)</text>
  </g>

  <!-- Approval -->
  <g transform="translate(0,208)">
    <rect x="30" y="24" width="840" height="290" rx="10" fill="url(#sky2)"/>
    <rect x="30" y="24" width="840" height="20" fill="#000" opacity="0.18"/>
    <path d="M142 24 q8 0 8 8 v190 q0 32 32 32 h536 q32 0 32 -32 v-190 q0 -8 8 -8 z" fill="#000" filter="url(#sh2)"/>
    <path d="M142 24 q8 0 8 8 v190 q0 32 32 32 h536 q32 0 32 -32 v-190 q0 -8 8 -8" fill="none" stroke="#FFB340" stroke-opacity="0.55"/>
    <circle cx="181" cy="78" r="15" fill="#D97757" fill-opacity="0.16"/>
    <text x="174" y="84" fill="#D97757" font-size="15">✦</text>
    <text x="206" y="74" fill="#fff" font-size="13" font-weight="600">Claude wants to run a command</text>
    <text x="206" y="90" fill="#fff" fill-opacity="0.55" font-size="11">hdc-classifier · Bash</text>
    <circle cx="726" cy="78" r="10" fill="none" stroke="#FFB340" stroke-opacity="0.25" stroke-width="2.5"/>
    <path d="M726 68 a10 10 0 1 1 -9.5 13" fill="none" stroke="#FFB340" stroke-width="2.5" stroke-linecap="round"/>
    <text x="721" y="81" fill="#fff" fill-opacity="0.7" font-size="8" font-weight="700">74</text>
    <rect x="166" y="102" width="572" height="82" rx="12" fill="#fff" fill-opacity="0.06"/>
    <text x="178" y="122" fill="#fff" fill-opacity="0.5" font-size="11">Run the test suite, then stage eval.py</text>
    <text x="178" y="140" fill="#fff" fill-opacity="0.9" font-size="11" font-family="SF Mono, Menlo, monospace">$ python -m pytest tests/ -q &amp;&amp; git add eval.py</text>
    <rect x="166" y="196" width="72" height="28" rx="14" fill="#FF453A" fill-opacity="0.18"/>
    <text x="182" y="214" fill="#FF453A" font-size="12" font-weight="600">✕ Deny</text>
    <rect x="246" y="196" width="94" height="28" rx="14" fill="#fff" fill-opacity="0.12"/>
    <text x="262" y="214" fill="#fff" font-size="12" font-weight="600">Terminal</text>
    <rect x="532" y="196" width="118" height="28" rx="14" fill="#fff" fill-opacity="0.12"/>
    <text x="546" y="214" fill="#fff" font-size="12" font-weight="600">Always allow</text>
    <rect x="658" y="196" width="80" height="28" rx="14" fill="#32D74B"/>
    <text x="676" y="214" fill="#000" font-size="12" font-weight="700">✓ Allow</text>
    <text x="42" y="284" fill="#fff" opacity="0.85" font-size="13" font-weight="600">Approve Claude Code from the notch</text>
  </g>

  <!-- Screenshot banner -->
  <g transform="translate(0,516)">
    <rect x="30" y="24" width="840" height="150" rx="10" fill="url(#sky2)"/>
    <rect x="30" y="24" width="840" height="20" fill="#000" opacity="0.18"/>
    <path d="M227 24 q8 0 8 8 v66 q0 24 24 24 h382 q24 0 24 -24 v-66 q0 -8 8 -8 z" fill="#000" filter="url(#sh2)"/>
    <rect x="251" y="68" width="34" height="34" rx="6" fill="#8AB4F8" fill-opacity="0.35"/>
    <rect x="256" y="74" width="24" height="4" rx="2" fill="#fff" fill-opacity="0.6"/>
    <rect x="256" y="82" width="16" height="4" rx="2" fill="#fff" fill-opacity="0.4"/>
    <text x="296" y="80" fill="#fff" font-size="13" font-weight="600">Screenshot on the shelf</text>
    <text x="296" y="98" fill="#fff" fill-opacity="0.7" font-size="12">Hover the notch and drag it anywhere.</text>
    <text x="42" y="158" fill="#fff" opacity="0.85" font-size="13" font-weight="600">New screenshots land on the shelf</text>
  </g>
</svg>
