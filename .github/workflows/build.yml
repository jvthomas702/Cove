name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for the version in Resources/Info.plist"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash -o pipefail -e {0}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          { sw_vers; swift --version; } 2>&1 | tee toolchain.log

      - name: Build
        run: swift build -c release 2>&1 | tee build.log

      - name: Test
        run: swift test 2>&1 | tee test.log

      - name: Native UI flows
        run: |
          UI_PROJECT="$(python3 scripts/ui-test-xcode.py)"
          xcodebuild test -project "$UI_PROJECT" -scheme CoveUI -destination 'platform=macOS' -resultBundlePath ui-tests.xcresult 2>&1 | tee ui-tests.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cove-ui-test-results
          path: |
            ui-tests.xcresult
            ui-tests.log

      - name: Package app
        env:
          COVE_UNIVERSAL: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release }}
        run: |
          if [ "$COVE_UNIVERSAL" = "true" ]; then export COVE_UNIVERSAL=1; fi
          ./scripts/build-app.sh 2>&1 | tee package.log

      - name: Signed update validation
        run: |
          ./scripts/test-update-signatures.sh 2>&1 | tee update-signatures.log
          python3 scripts/test-update-install.py .build 2>&1 | tee update-install.log

      - name: Check scripts and extension
        run: |
          {
            for f in bin/* scripts/*.sh; do
              if [[ "$f" == *.py ]]; then python3 -m py_compile "$f"; else bash -n "$f"; fi
              echo "ok $f"
            done
            for f in extension/*.js; do node --check "$f" && echo "ok $f"; done
            node --test Tests/Browser/extension.test.cjs
            python3 -m unittest discover -s Tests/Codex -v
            python3 -c "import json; json.load(open('extension/manifest.json')); print('ok manifest.json')"
          } 2>&1 | tee scripts.log

      - name: Verify app bundle
        run: |
          {
            plutil -lint build/Cove.app/Contents/Info.plist
            codesign --verify --deep --strict --verbose=2 build/Cove.app
            ls build/Cove.app/Contents/Resources build/Cove.app/Contents/Resources/bin
            test -f build/Cove.app/Contents/Resources/AppIcon.icns
            test -f build/Cove.app/Contents/Resources/extension/manifest.json
            test -f build/Cove.app/Contents/Resources/TeamLogos/nba-1.png
            test -f build/Cove.app/Contents/Resources/TeamLogos/nfl-1.png
            test -f build/Cove.app/Contents/Resources/TeamLogos/cfb-194.png
            test -f build/Cove.app/Contents/Frameworks/Sparkle.framework/Sparkle
            echo "bundle ok"
          } 2>&1 | tee bundle.log

      - name: Run the app and take UI snapshots
        continue-on-error: true
        run: ./scripts/ci-snapshots.sh 2>&1 | tee snapshots.log

      - name: Test signing identity script
        run: ./scripts/make-signing-identity.sh --test 2>&1 | tee signing.log

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent Cove.app Cove.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cove-app
          path: build/Cove.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          COVE_UPDATE_ED25519_KEY: ${{ secrets.COVE_UPDATE_ED25519_KEY }}
          COVE_UPDATE_PUBLISH_TOKEN: ${{ secrets.COVE_UPDATE_PUBLISH_TOKEN }}
        run: |
          : "${COVE_UPDATE_ED25519_KEY:?Set the repository Actions secret COVE_UPDATE_ED25519_KEY before publishing}"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Cove.zip --clobber
          else
            gh release create "$TAG" build/Cove.zip --target "$GITHUB_SHA" --title "Cove $VERSION" --notes-file RELEASE_NOTES.md
          fi
          export COVE_BUILD_PATH="$PWD/.build/arm64"
          if [ -n "$COVE_UPDATE_PUBLISH_TOKEN" ]; then
            GH_TOKEN="$COVE_UPDATE_PUBLISH_TOKEN" ./scripts/publish-updates.sh
          else
            echo 'Private release uploaded. Publish public signed updates locally, or configure a token scoped to Cove-updates.'
          fi

      # Logs go to the ci-logs branch so they can be read with plain git.
      - name: Publish logs
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/ci-logs
          cp *.log /tmp/ci-logs/ 2>/dev/null || true
          cp -R snapshots /tmp/ci-logs/ 2>/dev/null || true
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF_NAME}"
            echo "status: ${{ job.status }}"
          } > /tmp/ci-logs/summary.txt
          cd /tmp/ci-logs
          git init -q
          git checkout -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Logs for ${GITHUB_SHA::7} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
