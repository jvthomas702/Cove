<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f6b"/>
      <stop offset="1" stop-color="#7a4e6e"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#0b6b30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="690" fill="#0f1016"/>

  <!-- Row helper: each row is a strip of "desktop" with the island at top centre -->
  <!-- 1. Idle -->
  <g transform="translate(0,0)">
    <rect x="30" y="24" width="840" height="64" rx="10" fill="url(#sky)"/>
    <rect x="30" y="24" width="840" height="20" fill="#000" opacity="0.18"/>
    <path d="M355 24 h190 v18 q0 10 -10 10 h-170 q-10 0 -10 -10 z" fill="#000"/>
    <text x="42" y="80" fill="#fff" opacity="0.85" font-size="13" font-weight="600">Idle — hides inside the notch</text>
  </g>

  <!-- 2. Compact: Claude working + music -->
  <g transform="translate(0,110)">
    <rect x="30" y="24" width="840" height="64" rx="10" fill="url(#sky)"/>
    <rect x="30" y="24" width="840" height="20" fill="#000" opacity="0.18"/>
    <path d="M303 24 q8 0 8 8 v12 q0 12 12 12 h254 q12 0 12 -12 v-12 q0 -8 8 -8 z" fill="#000"/>
    <text x="330" y="45" fill="#D97757" font-size="15">✦</text>
    <circle cx="566" cy="40" r="6" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="26 12"/>
    <text x="42" y="80" fill="#fff" opacity="0.85" font-size="13" font-weight="600">Compact — Claude Code is working (spinner), one glance</text>
  </g>

  <!-- 3. Banner: Claude done -->
  <g transform="translate(0,220)">
    <rect x="30" y="24" width="840" height="140" rx="10" fill="url(#sky)"/>
    <rect x="30" y="24" width="840" height="20" fill="#000" opacity="0.18"/>
    <path d="M227 24 q8 0 8 8 v66 q0 24 24 24 h382 q24 0 24 -24 v-66 q0 -8 8 -8 z" fill="#000" filter="url(#shadow)"/>
    <path d="M227 24 q8 0 8 8 v66 q0 24 24 24 h382 q24 0 24 -24 v-66 q0 -8 8 -8" fill="none" stroke="#32D74B" stroke-opacity="0.55"/>
    <circle cx="268" cy="85" r="17" fill="#D97757" fill-opacity="0.2"/>
    <text x="261" y="91" fill="#D97757" font-size="16">✦</text>
    <text x="296" y="80" fill="#fff" font-size="13" font-weight="600">Claude is done · hdc-classifier</text>
    <text x="296" y="98" fill="#fff" fill-opacity="0.7" font-size="12">Added plot_confusion_matrix(). All 14 tests pass.</text>
    <text x="42" y="156" fill="#fff" opacity="0.85" font-size="13" font-weight="600">Banner — agent finished, notification, or alert (click to jump back)</text>
  </g>

  <!-- 4. Expanded -->
  <g transform="translate(0,382)">
    <rect x="30" y="24" width="840" height="270" rx="10" fill="url(#sky)"/>
    <rect x="30" y="24" width="840" height="20" fill="#000" opacity="0.18"/>
    <path d="M122 24 q8 0 8 8 v170 q0 32 32 32 h576 q32 0 32 -32 v-170 q0 -8 8 -8 z" fill="#000" filter="url(#shadow)"/>
    <text x="150" y="44" fill="#fff" font-size="12">⌂</text>
    <text x="172" y="44" fill="#fff" fill-opacity="0.4" font-size="12">▤</text>
    <text x="712" y="44" fill="#fff" fill-opacity="0.75" font-size="11" font-weight="600">87%</text>
    <!-- media card -->
    <rect x="146" y="64" width="236" height="76" rx="16" fill="#fff" fill-opacity="0.07"/>
    <rect x="156" y="74" width="56" height="56" rx="12" fill="url(#art)"/>
    <text x="222" y="92" fill="#fff" font-size="13" font-weight="600">Pink + White</text>
    <text x="222" y="108" fill="#fff" fill-opacity="0.6" font-size="11">Frank Ocean</text>
    <text x="222" y="128" fill="#fff" font-size="12">⏮   ⏸   ⏭</text>
    <!-- focus card -->
    <rect x="146" y="150" width="236" height="50" rx="16" fill="#fff" fill-opacity="0.07"/>
    <text x="160" y="180" fill="#FFB340" font-size="14">⏱</text>
    <text x="182" y="180" fill="#fff" font-size="12" font-weight="600">Focus</text>
    <rect x="262" y="164" width="34" height="22" rx="11" fill="#fff" fill-opacity="0.1"/><text x="269" y="179" fill="#fff" font-size="11" font-weight="600">25m</text>
    <rect x="300" y="164" width="34" height="22" rx="11" fill="#fff" fill-opacity="0.1"/><text x="307" y="179" fill="#fff" font-size="11" font-weight="600">50m</text>
    <rect x="338" y="164" width="34" height="22" rx="11" fill="#fff" fill-opacity="0.1"/><text x="345" y="179" fill="#fff" font-size="11" font-weight="600">90m</text>
    <!-- activity list -->
    <text x="396" y="76" fill="#fff" fill-opacity="0.45" font-size="10" font-weight="700" letter-spacing="0.8">ACTIVITY</text>
    <rect x="394" y="84" width="352" height="44" rx="12" fill="#fff" fill-opacity="0.05"/>
    <circle cx="416" cy="106" r="13" fill="#D97757" fill-opacity="0.15"/><text x="410" y="111" fill="#D97757" font-size="13">✦</text>
    <text x="436" y="102" fill="#fff" font-size="12" font-weight="600">swarm-nav</text>
    <text x="436" y="118" fill="#fff" fill-opacity="0.65" font-size="11">Editing formation_controller.py</text>
    <circle cx="730" cy="106" r="6" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="26 12"/>
    <rect x="394" y="134" width="352" height="44" rx="12" fill="#fff" fill-opacity="0.05"/>
    <circle cx="416" cy="156" r="13" fill="#8AB4F8" fill-opacity="0.15"/><text x="409" y="161" fill="#8AB4F8" font-size="12">&gt;_</text>
    <text x="436" y="152" fill="#fff" font-size="12" font-weight="600">python train.py --dim 10000</text>
    <rect x="436" y="164" width="270" height="3" rx="1.5" fill="#fff" fill-opacity="0.12"/>
    <rect x="436" y="164" width="170" height="3" rx="1.5" fill="#8AB4F8"/>
    <text x="716" y="160" fill="#8AB4F8" font-size="10" font-weight="700">63%</text>
    <rect x="394" y="184" width="352" height="34" rx="12" fill="#fff" fill-opacity="0.03"/>
    <rect x="404" y="191" width="20" height="20" rx="5" fill="#EA4335"/>
    <text x="436" y="205" fill="#fff" font-size="11" font-weight="600">Gmail · Interview invitation</text>
    <text x="42" y="284" fill="#fff" opacity="0.85" font-size="13" font-weight="600">Expanded — hover the notch</text>
  </g>
</svg>
