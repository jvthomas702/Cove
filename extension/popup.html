<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 280px; background: #0b0b0f; color: rgba(255,255,255,.95);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
  header img { width: 28px; height: 28px; }
  h1 { font: 600 14px/1.2 "SF Pro Rounded", -apple-system, sans-serif; margin: 0; }
  #status { font-size: 11.5px; color: rgba(255,255,255,.6); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: #8e8e93; }
  section { margin: 0 10px 10px; background: rgba(255,255,255,.06); border-radius: 14px; padding: 4px 12px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; }
  label + label { border-top: 1px solid rgba(255,255,255,.07); }
  .hint { display: block; font-size: 11px; color: rgba(255,255,255,.5); }
  input[type=number] { width: 64px; background: rgba(255,255,255,.08); color: inherit; border: 0; border-radius: 7px; padding: 4px 6px; font: inherit; }
  button { margin: 0 10px 14px; width: calc(100% - 20px); height: 32px; border: 0; border-radius: 16px;
           background: #30D158; color: #000; font: 600 12.5px/1 "SF Pro Rounded", -apple-system, sans-serif; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid #0A84FF; outline-offset: 2px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>Cove</h1>
      <div id="status"><span id="dot"></span><span id="statusText">Checking…</span></div>
    </div>
  </header>
  <section>
    <label>
      <span>Watch chat tabs<span class="hint">Live activity for ChatGPT, Claude, Gemini</span></span>
      <input type="checkbox" id="enabled">
    </label>
    <label>
      <span>Ping even when I'm looking<span class="hint">Off: keep completed work in the widget quietly</span></span>
      <input type="checkbox" id="notifyWhenLooking">
    </label>
    <label>
      <span>Include reply previews<span class="hint">Local to Cove; off shows status and character counts</span></span>
      <input type="checkbox" id="includePreviews">
    </label>
    <label>
      <span>Cove port</span>
      <input type="number" id="port" min="1" max="65535">
    </label>
  </section>
  <button id="test">Send a test ping</button>
  <script src="popup.js"></script>
</body>
</html>
